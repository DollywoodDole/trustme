<style>
  :root {
    --bg: #ececf0; --surface: #ffffff; --text: #16161a; --muted: #5d5d66; --line: #d9d9e0;
    --btn: #16161a; --btn-text: #ffffff;

    --stage-bg: #0b1030; --stage-text: #ffffff;
    --cap-bg: #ffffff; --cap-text: #14202a; --cap-edge: #1a56c9; --pin: #ff5fa2;

  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e12; --surface: #1c1c22; --text: #f3f3f6; --muted: #a0a0ab; --line: #2e2e36;
      --btn: #f3f3f6; --btn-text: #16161a;
      --stage-bg: #05081c; --stage-text: #ffffff;
      --cap-bg: #14202a; --cap-text: #ffffff; --cap-edge: #ff5fa2;
      --chip-bg: #ffffff; --chip-text: #14202a;
      --scrim: rgba(4, 8, 30, 0.6);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  }

  /* Gate */
  .gate { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; transition: opacity .3s ease, transform .3s ease; }
  .gate.gone { opacity: 0; transform: scale(1.04); pointer-events: none; }
  .hidden-content { position: absolute; inset: 0; overflow: hidden; filter: blur(48px) saturate(1.2); opacity: .55; }
  .hidden-content span { position: absolute; border-radius: 50%; }
  .hidden-content span:nth-child(1) { width: 60vmax; height: 60vmax; left: -15vmax; top: -10vmax; background: var(--blob-a); }
  .hidden-content span:nth-child(2) { width: 45vmax; height: 45vmax; right: -10vmax; top: 20vh; background: var(--blob-b); }
  .hidden-content span:nth-child(3) { width: 50vmax; height: 50vmax; left: 10vw; bottom: -25vmax; background: var(--blob-c); }
  .card { position: relative; width: min(360px, 100%); background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 18px; padding: 32px 24px 20px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .card svg { width: 44px; height: 44px; margin-bottom: 14px; color: var(--text); }
  .card h1 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 8px; }
  .card p { font-size: 15px; line-height: 1.45; color: var(--muted); margin-bottom: 24px; }
  .btn { display: block; width: 100%; font: inherit; font-size: 16px; font-weight: 600; border-radius: 12px; padding: 14px 16px; cursor: pointer; border: 0; }
  .btn:focus-visible { outline: 3px solid var(--blob-c); outline-offset: 3px; }
  .btn-primary { background: var(--btn); color: var(--btn-text); }
  .btn-ghost { background: transparent; color: var(--muted); margin-top: 6px; font-weight: 500; }
  .wiggle { animation: wiggle .4s ease; }
  @keyframes wiggle { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

  /* Stage */
  .stage { position: fixed; inset: 0; background: var(--stage-bg); display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .15s ease; }
  .stage.on { opacity: 1; pointer-events: auto; }

  #cv { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: manipulation; }
  .hud { position: absolute; inset: 0; pointer-events: none; font-family: "Silkscreen", "Courier New", monospace; }
  .hud button { pointer-events: auto; font-family: inherit; cursor: pointer; }
  .hud button:focus-visible { outline: 3px solid var(--hot); outline-offset: 3px; }

  .cap { position: absolute; left: 14px; top: calc(14px + env(safe-area-inset-top)); display: flex; gap: 10px; align-items: center;
    padding: 8px 14px 8px 12px; background: var(--cap-bg); color: var(--cap-text); border-radius: 3px; box-shadow: 0 3px 0 var(--cap-edge);

  .pin { width: 11px; height: 11px; background: var(--pin); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); flex: none; }
  .cap b { display: block; font-size: 15px; font-weight: 700; line-height: 1.1; }
  .cap small { display: block; font-size: 10px; opacity: .75; margin-top: 2px; }

  .snd { position: absolute; right: 12px; top: calc(12px + env(safe-area-inset-top)); font-size: 11px; background: var(--cap-bg); color: var(--cap-text); border: 0; border-radius: 3px; padding: 7px 9px; opacity: .85; }

  .end { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; padding: 48px 20px calc(26px + env(safe-area-inset-bottom));
    background: linear-gradient(to bottom, transparent, var(--scrim)); color: var(--stage-text);
    opacity: 0; transform: translateY(24px); transition: opacity .4s ease, transform .5s cubic-bezier(.3,1.5,.5,1); }
  .end.show { opacity: 1; transform: none; }
  .end:not(.show) button { pointer-events: none; }
  .end h2 { font-size: clamp(22px, 7vw, 32px); font-weight: 700; line-height: 1.05; margin-bottom: 10px; text-shadow: 0 3px 0 var(--hot), 0 6px 0 var(--deep); }
  .end p { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; margin-bottom: 16px; opacity: .9; }
  .row { display: flex; gap: 10px; justify-content: center; }
  .chip { font-size: 13px; font-weight: 700; background: var(--chip-bg); color: var(--chip-text); border: 0; border-radius: 3px; padding: 12px 16px; box-shadow: 0 3px 0 var(--hot); }
  .chip.outline { background: transparent; color: var(--stage-text); box-shadow: inset 0 0 0 2px var(--stage-text); }

<body>

<section class="gate" id="gate" aria-labelledby="gate-title">
  <div class="hidden-content" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="card" role="dialog" aria-modal="true">

      <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/>

    <h1 id="gate-title">Sensitive content</h1>
    <p>This page contains content that some people may find inappropriate. Viewer discretion is advised.</p>
    <button class="btn btn-primary" id="trust">Trust me</button>
    <button class="btn btn-ghost" id="back">Take me back</button>

</section>

<section class="stage" id="stage" aria-hidden="true">
  <div class="frame" id="frame">
    <canvas id="cv" role="img" aria-label="A pixel goo creature dances in a strobing room, transforms into a dragon, smashes through into a blue sky and flies over downtown Calgary, Stephen Avenue past Barbarella, and Bridgeland."></canvas>
    <div class="hud">
      <div class="cap" id="cap" aria-live="polite"><span class="pin"></span><div><b id="capT"></b><small id="capS"></small></div></div>
      <button class="snd" id="snd" aria-pressed="false">Mute</button>

      <div class="end" id="end">

        <p>Send it to someone who needs this today.</p>
        <div class="row">
          <button class="chip" id="share">Send it</button>
          <button class="chip outline" id="again">Run it back</button>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const gate = $('gate'), stage = $('stage'), frame = $('frame'), cv = $('cv'), ctx = cv.getContext('2d');
const capEl = $('cap'), capT = $('capT'), capS = $('capS'), hintEl = $('hint'), endEl = $('end');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= helpers ================= */
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];

}
function ell(x, cx, cy, rx, ry) { x.beginPath(); x.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); x.fill(); }
function tri(x, a, b, c, d, e, f) { x.beginPath(); x.moveTo(a, b); x.lineTo(c, d); x.lineTo(e, f); x.closePath(); x.fill(); }

// Snap a soft vector drawing to a hard pixel palette and add a 1px outline

    solid[p] = 1; let best = 0, bd = 1e9;

    d[i] = pal[best][0]; d[i + 1] = pal[best][1]; d[i + 2] = pal[best][2]; d[i + 3] = 255;

// 3x5 pixel font for signage
const FONT = { A: '010101111101101', B: '110101110101110', E: '111100110100111', L: '100100100100111', R: '110101110101101' };

/* ================= sizing ================= */
const W = 180; let H = 360;
function resize() {
  const dispW = Math.min(innerWidth, innerHeight * 0.62);

  frame.style.width = dispW + 'px'; frame.style.height = innerHeight + 'px';
  ctx.imageSmoothingEnabled = false;
  tiles = null; shatterMade = false;

/* ================= palette ================= */
const C = {
  blob: '#6ff0a8', blobShade: '#38c785', ink: '#14202a', white: '#ffffff', out: '#123528',
  body: '#6ff0a8', shade: '#38c785', belly: '#ffd166', wing: '#ff5fa2', wing2: '#c73a7c',
  bone: '#2a8a5e', bone2: '#1f6b49', tongue: '#ff8fa3'
};
const PAL_BLOB = [C.blob, C.blobShade, C.ink, C.white].map(hex);
const PAL_DRAGON = [C.body, C.shade, C.belly, C.wing, C.wing2, C.bone, C.bone2, C.ink, C.white, C.tongue].map(hex);
const OUT = hex(C.out);

/* ================= sprites ================= */
const BW = 100, BH = 84, DW = 132, DH = 100;
const blobC = [0, 1, 2, 3].map(() => mk(BW, BH));
const [dragC, dragX] = mk(DW, DH), [tmpC, tmpX] = mk(DW, DH), [mixC, mixX] = mk(DW, DH), [tintC, tintX] = mk(DW, DH);
const rnd = new Float32Array(DW * DH).map(() => Math.random());

function renderBlob(i, p) {

  const cx = 50, base = 78, rx = 24 * p.sx, ry = 20 * p.sy, cy = base - ry;
  const path = new Path2D();

    const a = k / 56 * Math.PI * 2;
    let r = 1 + 0.07 * Math.sin(3 * a + p.t * 2.2) + 0.05 * Math.sin(5 * a - p.t * 3.1);
    r += p.pod * Math.pow(Math.max(0, Math.cos(a + 2.2)), 10) * 0.6 + p.pod2 * Math.pow(Math.max(0, Math.cos(a + 0.95)), 10) * 0.6;

function wing(x, Sx, Sy, f, col, bone) {
  const u = (f + 1) / 2;
  const ex = Sx - 6, ey = lerp(Sy + 14, Sy - 24, u), tx = lerp(Sx - 22, Sx - 30, u), ty = lerp(Sy + 30, Sy - 40, u), bx = Sx - 20, by = Sy + 6;

  const q1x = lerp(tx, f1x, 0.5), q1y = lerp(ty, f1y, 0.5), q2x = lerp(f1x, bx, 0.5), q2y = lerp(f1y, by, 0.5);

  x.lineWidth = 1.6; x.beginPath(); x.moveTo(ex, ey); x.lineTo(f1x, f1y); x.stroke();
}

function renderDragon(f, f2, mouth) {
  const x = dragX; x.clearRect(0, 0, DW, DH); x.lineCap = 'round'; x.lineJoin = 'round';
  wing(x, 70, 46, f2, C.wing2, C.bone2);
  x.fillStyle = C.belly; for (let i = 0; i < 5; i++) { const s = 48 + i * 6; tri(x, s, 51, s + 3, 42 - (i === 2 ? 2 : 0), s + 6, 51); }

  x.fillStyle = C.shade; ell(x, 56, 72, 5, 6); ell(x, 74, 72, 5, 6);
  x.fillStyle = C.ink; x.fillRect(52, 77, 3, 1); x.fillRect(70, 77, 3, 1);
  x.fillStyle = C.body; ell(x, 64, 60, 23, 13);
  x.save(); x.beginPath(); x.ellipse(64, 60, 23, 13, 0, 0, 7); x.clip(); x.fillStyle = C.belly; ell(x, 67, 70, 18, 7); x.restore();

  x.fillStyle = C.belly; tri(x, 92, 28, 78, 17, 96, 24); tri(x, 98, 25, 92, 13, 102, 24);
  if (mouth > 0) { x.fillStyle = C.ink; tri(x, 104, 40, 121, 38, 119, 48); x.fillStyle = C.tongue; tri(x, 108, 42, 118, 42, 117, 45); x.fillStyle = C.body; ell(x, 111, 48, 8, 3); }
  else { x.fillStyle = C.ink; x.fillRect(106, 40, 12, 1); }
  x.fillStyle = C.ink; x.fillRect(118, 35, 2, 1);
  wing(x, 60, 50, f, C.wing, C.bone);
  x.fillStyle = C.ink; x.fillRect(99, 29, 12, 5); x.fillRect(89, 30, 10, 1); x.fillRect(111, 30, 4, 2);
  pixelize(dragC, x, PAL_DRAGON, OUT);
  x.fillStyle = C.white; x.fillRect(101, 30, 3, 1); x.fillRect(105, 31, 1, 1);

function drawCentered(src, w, h, cx, cy, s = 1, rot = 0, alpha = 1) {

}

  if (amt < 0.5) return;
  tintX.clearRect(0, 0, DW, DH); tintX.drawImage(src, 0, 0, w, h, 0, 0, w, h);

  tintX.fillStyle = '#ff2a6d'; tintX.fillRect(0, 0, DW, DH); drawCentered(tintC, w, h, cx - amt, cy, s, 0, 0.55);
  tintX.fillStyle = '#22e6ff'; tintX.fillRect(0, 0, DW, DH); drawCentered(tintC, w, h, cx + amt, cy, s, 0, 0.55);

}

/* ================= clouds ================= */
const CLOUDS = [[44, 16], [34, 13], [56, 18]].map(([w, h]) => {
  const [c, x] = mk(w, h), R = prng(w);
  x.fillStyle = '#d6eaff'; for (let i = 0; i < 6; i++) ell(x, 7 + R() * (w - 14), h * 0.62, 5 + R() * 4, 4 + R() * 2);
  x.fillStyle = '#ffffff'; for (let i = 0; i < 6; i++) ell(x, 7 + R() * (w - 14), h * 0.45, 5 + R() * 4, 4 + R() * 2);

    for (let p = 0; p < DW * DH; p++) { const s = rnd[p] < k ? b : a, i = p * 4; od[i] = s[i]; od[i + 1] = s[i + 1]; od[i + 2] = s[i + 2]; od[i + 3] = s[i + 3]; }
    mixX.putImageData(o, 0, 0);
    const s = lerp(1, 1.25, k), my = bottom - 44;
    chroma(mixC, DW, DH, W / 2, my, 4 + k * 3, s);
    drawCentered(mixC, DW, DH, W / 2, my, s);
    if (Math.random() < 0.9) spawn(W / 2 + (Math.random() * 2 - 1) * 50, my + (Math.random() * 2 - 1) * 36, 2, [C.blob, C.wing, C.belly, '#ffffff'], 60, 20);
  }
}

/* ================= flight phase ================= */
function dragonY(t) {
  let y = H * 0.3;
  y = lerp(y, H * 0.5, ease(seg(t, 13.4, 14.6)));
  y = lerp(y, H * 0.38, ease(seg(t, 17.2, 18.6)));
  y = lerp(y, H * 0.26, ease(seg(t, 22, 23.2)));
  return y + Math.sin(t * Math.PI * 4) * 2;
}
function dragonState(t) {
  const cruiseX = W * 0.44 + Math.sin(t * 0.6) * 5;
  let x = cruiseX, y = dragonY(t), s = 1, rot = 0, mouth = 0;
  let f = Math.sin(t * Math.PI * 4), f2 = Math.sin(t * Math.PI * 4 - 0.7);
  if (t < 9.9) {
    const morphY = H * 0.5 - 16, c1 = ease(seg(t, 8.5, 8.8)), c2 = ease(seg(t, 8.8, 9.9));
    if (t < 8.8) { s = lerp(1.25, 2.3, c1); x = W / 2; y = lerp(morphY, H * 0.48, c1); }
    else { s = lerp(2.3, 1, c2); x = lerp(W / 2, cruiseX, c2); y = lerp(H * 0.48, dragonY(9.9), c2); }
    f = Math.sin(t * Math.PI * 6); f2 = Math.sin(t * Math.PI * 6 - 0.7); mouth = t < 9.3 ? 1 : 0;
  } else {
    rot = clamp((dragonY(t + 0.08) - y) * 0.08, -0.45, 0.45);
    if (t - pokeT < 0.45) mouth = 1;
  }
  rot += Math.PI * 2 * ease(seg(t, 22.7, 23.5));
  return { x, y, s, rot, f, f2, mouth };
}
let tiles = null, tilesSnap = null;
function makeShatter() {
  const [sc, sx] = mk(W, H); drawRoom(sx, 8.45); tilesSnap = sc; tiles = [];
  const cols = 5, rows = 9, tw = Math.ceil(W / cols), th = Math.ceil(H / rows);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const x0 = c * tw, y0 = r * th, dx = x0 + tw / 2 - W / 2, dy = y0 + th / 2 - H / 2, d = Math.hypot(dx, dy) || 1, sp = 70 + Math.random() * 90;
    tiles.push({ x0, y0, tw, th, vx: dx / d * sp, vy: dy / d * sp - 20, vr: (Math.random() * 2 - 1) * 4, delay: d / W * 0.12 });
  }
}
function drawShatter(t) {
  if (!tiles) return; const t0 = t - 8.5;
  for (const p of tiles) {
    const d = Math.max(0, t0 - p.delay), a = 1 - d / 0.9; if (a <= 0) continue;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(p.x0 + p.tw / 2 + p.vx * d, p.y0 + p.th / 2 + p.vy * d + 40 * d * d);
    ctx.rotate(p.vr * d); const sc = 1 + d * 1.6; ctx.scale(sc, sc);
    ctx.drawImage(tilesSnap, p.x0, p.y0, p.tw, p.th, -p.tw / 2, -p.th / 2, p.tw, p.th); ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function drawFlightPhase(t, dt) {
  const st = dragonState(t);
  const { wx } = drawWorld(t, st);
  drawShatter(t);
  if (t < 9.5) {
    const k = seg(t, 8.5, 9.5); ctx.fillStyle = 'rgba(255,255,255,' + (0.85 * (1 - k)) + ')';
    for (let i = 0; i < 28; i++) { const a = i / 28 * Math.PI * 2 + i * 0.37, r1 = 20 + ((t * 400 + i * 37) % 140); for (let r = r1; r < r1 + 18; r++) ctx.fillRect(Math.round(W / 2 + Math.cos(a) * r), Math.round(H * 0.48 + Math.sin(a) * r), 1, 1); }
  }
  renderDragon(st.f, st.f2, st.mouth);
  drawCentered(dragC, DW, DH, st.x, st.y, st.s, st.rot);
  lastD.x = st.x; lastD.y = st.y;
  if (t > 10) drawClouds(wx * 1.7, CL_FORE, 760, 2, 0.93);
  if (t > 9.2 && Math.random() < 0.6) streaks.push({ x: W + 4, y: Math.random() * H, len: 3 + Math.random() * 7, v: 140 + Math.random() * 90 });
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  streaks = streaks.filter(s => (s.x -= s.v * dt) > -12); for (const s of streaks) ctx.fillRect(Math.round(s.x), Math.round(s.y), Math.round(s.len), 1);
}

/* ================= particles ================= */
let parts = [], streaks = [];
const HEART = ['01010', '11111', '11111', '01110', '00100'];
function spawn(x, y, n, cols, spd = 40, up = 0, heart = false) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = spd * (0.4 + Math.random()); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - up, life: 0.6 + Math.random() * 0.7, age: 0, col: cols[i % cols.length], sz: Math.random() < 0.3 ? 2 : 1, g: heart ? -10 : 60, heart }); }
}
function stepParts(dt) {
  parts = parts.filter(p => (p.age += dt) < p.life);
  for (const p of parts) {
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; ctx.globalAlpha = 1 - p.age / p.life; ctx.fillStyle = p.col;
    if (p.heart) { for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) if (HEART[r][c] === '1') ctx.fillRect(Math.round(p.x) + c, Math.round(p.y) + r, 1, 1); }
    else ctx.fillRect(Math.round(p.x), Math.round(p.y), p.sz, p.sz);
  }
  ctx.globalAlpha = 1;
}

/* ================= frame ================= */
function draw(t, dt) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  let sh = 0;
  if (!reduced) { if (t > 6 && t < 8.5) sh = seg(t, 6, 8.5) * 2.5; else if (t >= 8.5 && t < 9.2) sh = 4 * (1 - seg(t, 8.5, 9.2)); }
  if (sh) ctx.translate(Math.round((Math.random() * 2 - 1) * sh), Math.round((Math.random() * 2 - 1) * sh));
  if (t < 8.5) drawRoomPhase(t); else drawFlightPhase(t, dt);
  stepParts(dt);
  let fl = 0;
  if (t > 8.2 && t < 8.5) fl = seg(t, 8.2, 8.5) * 0.5; else if (t >= 8.5 && t < 8.9) fl = (1 - seg(t, 8.5, 8.9)) * (reduced ? 0.5 : 1);
  if (fl > 0) { ctx.fillStyle = 'rgba(255,255,255,' + fl + ')'; ctx.fillRect(-10, -10, W + 20, H + 20); }
}
const CAPS = [[9.9, 13.3, 'Downtown Calgary', 'YYC'], [13.6, 15.0, 'Stephen Avenue', 'Downtown'], [15.0, 16.8, 'Barbarella', 'Stephen Ave'], [18.7, 21.8, 'Bridgeland', 'Across the Bow']];
let curCap = null, endShown = false;
function hud(t) {
  const c = CAPS.find(c => t >= c[0] && t < c[1]), key = c ? c[2] : '';
  if (key !== curCap) { curCap = key; if (c) { capT.textContent = c[2]; capS.textContent = c[3]; capEl.classList.add('show'); } else capEl.classList.remove('show'); }
  hintEl.classList.toggle('show', t > 0.8 && t < 4.5);
  if (t >= 23.6 && !endShown) { endShown = true; endEl.classList.add('show'); }
}

/* ================= audio ================= */
let actx = null, master = null, nbuf = null, audioOK = false, muted = false, perf0 = 0;
const run = { startAt: 0, step: 0 }, STEP = 0.125;
function initAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC(); master = actx.createGain(); master.gain.value = 0.6;
  const comp = actx.createDynamicsCompressor(); master.connect(comp).connect(actx.destination);
  nbuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  setInterval(schedule, 25);
  const go = () => { if (!audioOK) { audioOK = true; startRun(); } };
  if (actx.state === 'running') go(); else actx.resume().then(go).catch(() => {});
}
function now() { return audioOK ? actx.currentTime - run.startAt : (performance.now() - perf0) / 1000; }
function schedule() { if (!audioOK) return; while (run.startAt + run.step * STEP < actx.currentTime + 0.12) { play(run.step, run.startAt + run.step * STEP); run.step++; } }
function env(g, t, peak, dur, att = 0.005) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
function osc(type, freq, t, dur, peak, filt) {
  const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t);
  let n = o; if (filt) { const f = actx.createBiquadFilter(); f.type = filt.type; f.frequency.value = filt.f; o.connect(f); n = f; }
  n.connect(g).connect(master); env(g, t, peak, dur); o.start(t); o.stop(t + dur + 0.05); return o;
}
function noise(t, dur, peak, type, f, q = 1) {
  const s = actx.createBufferSource(), fl = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = nbuf; fl.type = type; fl.frequency.value = f; fl.Q.value = q; s.connect(fl).connect(g).connect(master);
  env(g, t, peak, dur); s.start(t, Math.random() * Math.max(0, 1.9 - dur)); s.stop(t + dur + 0.05); return { s, fl, g };
}
function kick(t, p = 1) { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.13); env(g, t, p, 0.25); o.connect(g).connect(master); o.start(t); o.stop(t + 0.3); }
const clap = (t, p = .45) => noise(t, .14, p, 'highpass', 1400);
const hat = (t, p = .12) => noise(t, .045, p, 'highpass', 7500);
function pad(freqs, t, dur) {
  const g = actx.createGain(), f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1500; f.connect(g).connect(master);
  g.gain.setValueAtTime(0.0001, t);
  for (let b = 0; b < dur / 0.5; b++) { const tb = t + b * 0.5; g.gain.setValueAtTime(0.012, tb); g.gain.linearRampToValueAtTime(0.055, tb + 0.3); }
  g.gain.linearRampToValueAtTime(0.0001, t + dur);
  freqs.forEach(fr => [-7, 7].forEach(dt => { const o = actx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; o.detune.value = dt; o.connect(f); o.start(t); o.stop(t + dur + 0.05); }));
}
function riser(t, dur) {
  const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(1100, t + dur); f.type = 'highpass'; f.frequency.value = 300;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.07, t + dur); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.02);
  o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
  const s = actx.createBufferSource(), bf = actx.createBiquadFilter(), ng = actx.createGain(); s.buffer = nbuf; bf.type = 'bandpass'; bf.Q.value = 1.5;
  bf.frequency.setValueAtTime(400, t); bf.frequency.exponentialRampToValueAtTime(7000, t + dur);
  ng.gain.setValueAtTime(0.0001, t); ng.gain.linearRampToValueAtTime(0.3, t + dur); ng.gain.linearRampToValueAtTime(0.0001, t + dur + 0.02);
  s.connect(bf).connect(ng).connect(master); s.start(t, 0); s.stop(t + Math.min(dur + 0.05, 1.99));
}
function impact(t) {
  const o = actx.createOscillator(), g = actx.createGain(); o.frequency.setValueAtTime(75, t); o.frequency.exponentialRampToValueAtTime(28, t + 1.2); env(g, t, 1, 1.4); o.connect(g).connect(master); o.start(t); o.stop(t + 1.5);
  noise(t, 1.6, 0.45, 'highpass', 3000);
  [140, 147].forEach(fr => { const r = actx.createOscillator(), rg = actx.createGain(), lp = actx.createBiquadFilter(), lfo = actx.createOscillator(), lg = actx.createGain();
    r.type = 'sawtooth'; r.frequency.setValueAtTime(fr, t); r.frequency.exponentialRampToValueAtTime(fr * 0.42, t + 0.95);
    lfo.frequency.value = 28; lg.gain.value = 10; lfo.connect(lg).connect(r.frequency);
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(1800, t); lp.frequency.exponentialRampToValueAtTime(350, t + 1);
    env(rg, t, 0.22, 1.05, 0.03); r.connect(lp).connect(rg).connect(master); r.start(t); lfo.start(t); r.stop(t + 1.1); lfo.stop(t + 1.1); });
  noise(t, 0.8, 0.22, 'bandpass', 800, 0.8);
}
function whoosh(t, dur) {
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(); s.buffer = nbuf; f.type = 'bandpass'; f.Q.value = 2;
  f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(2500, t + dur / 2); f.frequency.exponentialRampToValueAtTime(300, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.32, t + dur / 2); g.gain.linearRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(master); s.start(t, 0); s.stop(t + dur + 0.05);
}
const N = { G4: 392, A4: 440, Bb4: 466.16, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880 };
const MEL = [
  ['C5', 0, 'A4', 0, 'C5', 0, 'F5', 0, 'E5', 0, 'C5', 0, 'A4', 0, 'G4', 0],
  ['G4', 0, 'C5', 0, 'E5', 0, 'G5', 0, 'E5', 0, 'C5', 0, 'D5', 0, 'E5', 0],
  ['F5', 0, 0, 'E5', 'D5', 0, 'A4', 0, 'D5', 0, 'F5', 0, 'A5', 0, 'G5', 0],
  ['F5', 0, 'D5', 0, 'Bb4', 0, 'D5', 0, 'F5', 0, 'G5', 0, 'A5', 0, 0, 0]];
const BASS = [174.61, 130.81, 146.83, 116.54];
const PADS = [[349.23, 440, 523.25], [261.63, 329.63, 392], [293.66, 349.23, 440], [233.08, 293.66, 349.23]];
const RCH = [{ b: 220, a: [440, 523.25, 659.25] }, { b: 174.61, a: [349.23, 440, 523.25] }, { b: 261.63, a: [523.25, 659.25, 783.99] }, { b: 196, a: [392, 493.88, 587.33] }];
function play(s, t) {
  if (s < 48) {
    const st = s % 16, ch = RCH[Math.floor(s / 16) % 4];
    if (st % 4 === 0) kick(t, .9); if (st === 4 || st === 12) clap(t, .4); if (st % 4 === 2) hat(t, .12);
    if ([0, 3, 6, 8, 11, 14].includes(st)) osc('square', ch.b * (st === 8 ? 2 : 1), t, .15, .16, { type: 'lowpass', f: 900 });
    if (st % 2 === 0) osc('triangle', ch.a[(st / 2) % 3] * (st >= 8 ? 2 : 1), t, .12, .08);
  } else if (s < 68) {
    const b = s - 48;
    if (s === 48) riser(t, 2.5);
    if (b < 16 && b % 4 === 0) kick(t, .9);
    if (b < 8 ? b % 4 === 0 : b < 14 ? b % 2 === 0 : true) noise(t, .09, lerp(.15, .5, b / 20), 'highpass', 1200 + b * 60);
    if (b % 2 === 0) osc('square', 220 * Math.pow(2, b / 12), t, .1, .045, { type: 'lowpass', f: 2500 });
  } else if (s === 68) impact(t);
  else if (s >= 72) {
    const a = s - 72, bar = Math.floor(a / 16) % 4, st = a % 16;
    if (s === 108 || s === 176) whoosh(t, 1.1);
    if (st % 4 === 0) kick(t, 1); if (st === 4 || st === 12) clap(t, .5); hat(t, st % 2 ? .1 : .05);
    if (a % 64 === 0) noise(t, .9, .14, 'highpass', 5000);
    if (st % 2 === 0) osc('square', BASS[bar] * (st % 4 === 2 ? 2 : 1), t, .12, .14, { type: 'lowpass', f: 800 });
    if (st === 0) pad(PADS[bar], t, 2);
    const n = MEL[bar][st]; if (n) { osc('square', N[n], t, .18, .05, { type: 'lowpass', f: 3200 }); osc('triangle', N[n] / 2, t, .2, .05); }
  }
}
function sfxPoke(flying) {
  if (!audioOK) return; const t = actx.currentTime;
  if (flying) { osc('square', 900, t, .08, .08); osc('square', 1350, t + .07, .1, .07); }
  else { const o = osc('triangle', 260, t, .22, .25); o.frequency.exponentialRampToValueAtTime(720, t + .12); }
}

/* ================= run control ================= */
let running = false, last = 0, pokeT = -9, shatterMade = false, impactDone = false;
const lastD = { x: 0, y: 0 };
function startRun() {
  parts = []; streaks = []; tiles = null; shatterMade = false; impactDone = false; pokeT = -9;
  endShown = false; endEl.classList.remove('show'); curCap = null; capEl.classList.remove('show');
  if (audioOK) { run.startAt = actx.currentTime + 0.06; run.step = 0; }
  perf0 = performance.now();
}
function loop(ts) {
  requestAnimationFrame(loop);
  if (!running) return;
  const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016); last = ts;
  const t = DEBUG_T !== null ? DEBUG_T : now();
  if (t >= 8.5 && !shatterMade) { makeShatter(); shatterMade = true; }
  if (t >= 8.5 && !impactDone) { impactDone = true; try { navigator.vibrate && navigator.vibrate([80, 40, 140]); } catch (e) {} }
  draw(t, dt); hud(t);
}

/* ================= gate + controls ================= */
const back = $('back'), backLines = ['Are you sure?', 'Seriously. Trust me.']; let backTries = 0;
back.addEventListener('click', () => {
  if (backTries < backLines.length) { back.textContent = backLines[backTries++]; back.classList.remove('wiggle'); void back.offsetWidth; back.classList.add('wiggle'); }
  else reveal();
});
$('trust').addEventListener('click', reveal);
function reveal() {
  gate.classList.add('gone'); gate.setAttribute('aria-hidden', 'true');
  stage.classList.add('on'); stage.setAttribute('aria-hidden', 'false');
  resize(); initAudio(); startRun(); running = true;
}
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  const t = now(); pokeT = t;
  if (t < 6) { spawn(W / 2, H * 0.5, 14, [C.blob, '#ffffff', C.wing], 70, 40); sfxPoke(false); }
  else if (t > 9.9) { spawn(lastD.x + 20, lastD.y - 14, 5, ['#ff5fa2', '#ffd166', '#ffffff'], 30, 20, true); sfxPoke(true); }
});
$('again').addEventListener('click', startRun);
$('snd').addEventListener('click', e => {
  muted = !muted; if (master) master.gain.setTargetAtTime(muted ? 0 : 0.6, actx.currentTime, 0.02);
  e.currentTarget.textContent = muted ? 'Unmute' : 'Mute'; e.currentTarget.setAttribute('aria-pressed', String(muted));
});
$('share').addEventListener('click', async e => {
  const btn = e.currentTarget, url = location.href.split('?')[0];
  try {
    if (navigator.share) await navigator.share({ title: 'Sensitive content', text: 'Viewer discretion is advised.', url });
    else { await navigator.clipboard.writeText(url); btn.textContent = 'Link copied'; setTimeout(() => (btn.textContent = 'Send it'), 1800); }
  } catch (err) {}
});
document.addEventListener('visibilitychange', () => { if (!actx) return; document.hidden ? actx.suspend() : actx.resume(); });
addEventListener('resize', () => { if (running) resize(); });

// Preview helper: add ?at=12 to the URL to freeze on a moment (skips the gate, no sound)
const atParam = new URLSearchParams(location.search).get('at');
const DEBUG_T = atParam !== null ? parseFloat(atParam) : null;
if (DEBUG_T !== null) { gate.classList.add('gone'); stage.classList.add('on'); resize(); startRun(); running = true; }
requestAnimationFrame(loop);
})();
</script>
